<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mariage Aubin & Marguerite</title>
  <meta name="description" content="Site du mariage d'Aubin et Marguerite - 06 mars 2027 au Carrousel de Baronville." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{--cobalt:#0047ab;--navy:#001b4f;--mid:#000d2e;--ivory:#fffaf0;--champ:#f4d58d;--white:#fff;--text:#10213f;--spotify:#1db954}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:Montserrat,sans-serif;background:var(--mid);color:var(--white);overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    .page{min-height:100vh;position:relative;background:radial-gradient(circle at 10% 12%,rgba(255,250,240,.32),transparent 17%),radial-gradient(circle at 88% 10%,rgba(117,185,255,.35),transparent 22%),radial-gradient(circle at 72% 72%,rgba(244,213,141,.22),transparent 24%),linear-gradient(135deg,#000d2e 0%,#0047ab 39%,#063f9e 63%,#001b4f 100%)}
    .page:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:74px 74px;mask-image:radial-gradient(circle at center,black,transparent 82%)}
    .container{width:min(1120px,calc(100% - 40px));margin:0 auto;position:relative;z-index:2}

    header{position:sticky;top:0;z-index:50;padding:22px 0;background:rgba(0,18,68,.46);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.12)}
    nav{display:flex;justify-content:space-between;align-items:center;gap:24px}
    .brand{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.9);font-size:13px;letter-spacing:.28em;text-transform:uppercase}
    .brand-heart{color:var(--champ);font-size:18px;letter-spacing:0}
    .nav-links{display:flex;gap:28px;color:rgba(255,255,255,.80);font-size:14px}
    .nav-links a:hover{color:#fff}

    section{padding:88px 0}

    .hero{padding:82px 0 90px;display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center}
    .eyebrow{margin-bottom:18px;color:#dbeaff;font-size:13px;font-weight:500;letter-spacing:.34em;text-transform:uppercase}

    h1{font-family:Allura,cursive;font-weight:400;font-size:clamp(54px,7.2vw,92px);line-height:.94;color:var(--ivory);text-shadow:0 24px 62px rgba(0,0,0,.34)}
    h2{font-family:"Cormorant Garamond",serif;font-size:clamp(42px,6vw,66px);line-height:1;color:var(--ivory);font-weight:600}
    h3{font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1.05}

    .hero-info{margin-top:28px;display:grid;gap:14px;color:#edf6ff;font-size:18px;line-height:1.48}
    .info-line{display:flex;align-items:flex-start;gap:12px}
    .icon{color:var(--champ);flex-shrink:0}

    .actions{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:15px 24px;border:1px solid rgba(255,255,255,.42);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
    .button:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(0,0,0,.18)}
    .button.primary{background:var(--ivory);color:var(--navy);border-color:var(--ivory)}
    .button.secondary{background:rgba(255,255,255,.10);color:#fff}
    .button.spotify{background:var(--spotify);color:#fff;border-color:var(--spotify)}

    .hero-photo-card{padding:14px;border-radius:36px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 88px rgba(0,0,0,.30);backdrop-filter:blur(18px);overflow:hidden}
    .hero-photo-stage{min-height:540px;border-radius:28px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:36px;text-align:center;overflow:hidden;background-size:cover;background-position:center;transition:background .4s ease}
